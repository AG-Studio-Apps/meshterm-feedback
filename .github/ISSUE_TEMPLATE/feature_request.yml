name: Feature request
description: Suggest a new feature or a change to how meshTerm works.
title: "[Feature]: "
labels: ["feature-request", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion!

        For early or open-ended ideas you would like to talk through first, [Discussions: Ideas](https://github.com/AG-Studio-Apps/meshterm-feedback/discussions/categories/ideas) is a great place to start.

        **This repository is public.** Please keep hostnames, addresses, usernames and secrets out of your request.

  - type: checkboxes
    id: searched
    attributes:
      label: Existing requests
      options:
        - label: I have searched the open and closed issues and this has not been requested yet. (If it has, please add a 👍 to that issue instead.)
          required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today? Describing the problem helps more than jumping straight to a solution.
      placeholder: When an agent finishes a long task overnight, I have no way to see a summary of what it did without opening each session.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Optional. Workarounds you use today, or how other apps handle this.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the app does this relate to? Pick all that apply.
      multiple: true
      options:
        - Terminal
        - Keyboard
        - tmux
        - mtRoam
        - Tailscale
        - Agents chat
        - herdr
        - Notifications
        - SFTP
        - Containers
        - Sync
        - Purchases
        - Other
    validations:
      required: true

  - type: dropdown
    id: importance
    attributes:
      label: How important is this to you?
      options:
        - Nice to have
        - Would make my day noticeably better
        - Important to how I use meshTerm
        - A blocker; I can't use meshTerm for my work without it
    validations:
      required: true

  - type: textarea
    # The meshTerm app prefills this field by id. Do not rename it.
    id: app-details
    attributes:
      label: App details
      description: Optional. In meshTerm, go to **Settings, Feedback and Feature Requests**, tap **Copy Details** and paste here. It contains no hostnames, addresses, usernames or session data.
      render: text
    validations:
      required: false
