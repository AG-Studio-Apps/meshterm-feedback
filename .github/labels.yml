# Label set for AG-Studio-Apps/meshterm-feedback.
# Apply with the loop in SETUP.md (gh label create --force is idempotent).
# Colours are hex without the leading '#'.

# Type
- name: bug
  color: d73a4a
  description: Something is broken or not working as it should
- name: feature-request
  color: a2eeef
  description: A request for a new feature or a change

# Lifecycle
- name: triage
  color: fbca04
  description: New, not yet looked at
- name: needs-info
  color: f9d0c4
  description: Waiting on more information from the reporter
- name: planned
  color: 0e8a16
  description: Accepted and intended, not yet started
- name: in-progress
  color: 1d76db
  description: Being worked on now
- name: shipped
  color: 5319e7
  description: Done; see the closing comment for the version it shipped in
- name: duplicate
  color: cfd3d7
  description: Already tracked in another issue
- name: wontfix
  color: ffffff
  description: Decided not to do this; the issue explains why

